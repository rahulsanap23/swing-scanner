name: daily-swing-scan

on:
  schedule:
    - cron: "45 13 * * 1-5"   # 13:45 UTC = 7:15 PM IST, Monday–Friday
  workflow_dispatch:           # "Run workflow" button for manual runs

permissions:
  contents: write              # lets the job commit output/ back to the repo

concurrency:
  group: daily-swing-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Run screener
        run: python screener.py

      - name: Commit results
        if: always()           # also commit the error report, so the Claude task can say what failed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output data/constituents
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "scan $(TZ=Asia/Kolkata date +%F)"
            git pull --rebase --autostash
            git push
          fi
